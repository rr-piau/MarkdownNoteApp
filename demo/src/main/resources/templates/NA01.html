<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Markdownエディタ</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Markdown編集画面</h1>
        <div class="pane">
            <section>
                <h2>Markdown編集用テキストボックス</h2>
                <textarea id="markdownInput" placeholder="ここにMarkdownを入力してください。" th:text="${initialMarkdown}"></textarea>
            </section>
            <section>
                <h2>Markdown閲覧用プレビュー</h2>
                <div id="preview"></div>
            </section>
        </div>
        <button id="saveButton">保存</button>
    </div>
    <script>
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function renderMarkdown(text) {
            const lines = text.split('\n');
            const html = lines.map(line => {
                if (/^#{1,6} /.test(line)) {
                    const level = line.match(/^#+/)[0].length;
                    return '<h' + level + '>' + escapeHtml(line.replace(/^#{1,6} /, '')) + '</h' + level + '>';
                }
                if (/^\*\s+/.test(line) || /^-\s+/.test(line) || /^\+\s+/.test(line)) {
                    return '<li>' + escapeHtml(line.replace(/^([*\-\+])\s+/, '')) + '</li>';
                }
                if (/^```/.test(line)) {
                    return line;
                }
                return '<p>' + escapeHtml(line) + '</p>';
            }).join('\n');
            const withLists = html.replace(/(<li>.*<\/li>\n?)+/g, match => {
                return '<ul>' + match + '</ul>';
            });
            const formatted = withLists
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
            return formatted.replace(/<p><\/p>/g, '');
        }
        const input = document.getElementById('markdownInput');
        const preview = document.getElementById('preview');
        function updatePreview() {
            preview.innerHTML = renderMarkdown(input.value);
        }
        input.addEventListener('input', updatePreview);
        document.getElementById('saveButton').addEventListener('click', async function() {
            try {
                const response = await fetch('/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ markdown: input.value })
                });
                const data = await response.json();
                alert(data.message || '保存しました');
            } catch (error) {
                alert('保存に失敗しました');
            }
        });
        updatePreview();
    </script>
</body>
</html>
